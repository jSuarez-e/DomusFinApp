<!-- frontend/src/app/presentation/pages/reset-password/reset-password.page.html -->
<ion-content [fullscreen]="true" class="premium-content">
  <div class="glow-bg"></div>

  <div class="auth-wrapper">
    <app-auth-header
      icon="lock-closed-outline"
      title="Nueva Contraseña"
      subtitle="Crea y confirma una nueva contraseña segura para tu cuenta">
    </app-auth-header>

    <ion-card class="auth-card">
      <ion-card-content>
        <form [formGroup]="resetForm" (ngSubmit)="handleResetPassword()">
          <!-- New Password Input -->
          <app-password-input
            [parentForm]="resetForm"
            controlName="newPassword"
            label="Nueva Contraseña"
            placeholder="Mínimo 6 caracteres"
            errorMessage="La contraseña es obligatoria (mínimo 6 caracteres).">
            <!-- Real-time strength validator component -->
            <app-password-strength [password]="resetForm.get('newPassword')?.value || ''">
            </app-password-strength>
          </app-password-input>

          <!-- Confirm Password Input -->
          <div class="input-wrapper">
            <app-password-input
              [parentForm]="resetForm"
              controlName="confirmPassword"
              label="Confirmar Contraseña"
              placeholder="Repite la contraseña"
              errorMessage="Debe confirmar su contraseña.">
              @if (resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.hasError('passwordMismatch')) {
                <div class="error-text">
                  Las contraseñas no coinciden.
                </div>
              }
            </app-password-input>
          </div>

          <!-- Submit Button -->
          <ion-button 
            type="submit"
            expand="block" 
            class="submit-button"
            [disabled]="resetForm.invalid">
            Cambiar Contraseña
          </ion-button>
        </form>

        <div class="auth-footer">
          <a routerLink="/login" class="back-link">
            <span>Volver al Login</span>
          </a>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
