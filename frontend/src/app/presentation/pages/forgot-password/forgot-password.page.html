<!-- frontend/src/app/presentation/pages/forgot-password/forgot-password.page.html -->
<ion-content [fullscreen]="true" class="premium-content">
  <div class="glow-bg"></div>

  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="app-logo">
        <ion-icon name="key-outline" class="logo-icon"></ion-icon>
      </div>
      <h1>Recuperar Contraseña</h1>
      <p class="auth-subtitle">Ingresa tu correo para recibir un enlace de restablecimiento de contraseña</p>
    </div>

    <ion-card class="auth-card">
      <ion-card-content>
        <form [formGroup]="recoveryForm" (ngSubmit)="handleForgotPassword()">
          <!-- Email Input -->
          <div class="input-wrapper">
            <label class="input-label">Correo Electrónico</label>
            <div class="input-field">
              <ion-icon name="mail-outline" class="field-icon"></ion-icon>
              <ion-input
                type="email"
                placeholder="correo@ejemplo.com"
                formControlName="email"
                class="premium-input">
              </ion-input>
            </div>
            @if (recoveryForm.get('email')?.invalid && recoveryForm.get('email')?.touched) {
              <div class="error-text">
                Ingrese un correo electrónico válido.
              </div>
            }
          </div>

          <!-- Submit Button -->
          <ion-button 
            type="submit"
            expand="block" 
            class="submit-button"
            [disabled]="recoveryForm.invalid">
            Enviar Instrucciones
          </ion-button>
        </form>

        <div class="auth-footer">
          <a routerLink="/login" class="back-link">
            <ion-icon name="arrow-back-outline"></ion-icon>
            <span>Volver al Login</span>
          </a>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
