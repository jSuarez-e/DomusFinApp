services:
  mysql:
    image: mysql:8.0
    container_name: domusfin_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: domusfin_db
      MYSQL_USER: domusfin_user
      MYSQL_PASSWORD: domusfin_password
    ports:
      - "3308:3306"
    volumes:
      - domusfin-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  domusfin-mysql-data:
